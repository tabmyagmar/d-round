# Yarn 4 (berry). PnP is disabled on purpose: Next.js, Prisma and several ESLint
# plugins still assume a node_modules tree.
nodeLinker: node-modules

# `yarn add` pins the exact version (project rule: no floating ranges).
defaultSemverRangePrefix: ""

# Lifecycle scripts are required: packages/database runs `prisma generate` on postinstall
# and the root `prepare` installs the husky hooks. (Overrides a user-level `false`.)
enableScripts: true

enableTelemetry: false
